name: CMake Qt6 CI (Linux/macOS/Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.9.2"
  BUILD_TYPE: Release
  QT_ROOT: ${{ github.workspace }}/.qt

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
            qt_arch: gcc_64
          - os: macos-latest
            host: mac
            qt_arch: clang_64
          - os: windows-latest
            host: windows
            qt_arch: auto

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tools (aqt + ninja)
        run: |
          python -m pip install --upgrade pip
          pip install "aqtinstall==3.*" ninja

      - name: Minimal Linux deps (Qt Widgets/XCB)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgl1-mesa-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-x11-0

      - name: Resolve Qt arch
        id: resolve
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            LIST="$(python -m aqt list-qt windows desktop --arch "${QT_VERSION}")" || LIST=""
            echo "Windows arch list for Qt ${QT_VERSION}: $LIST"
            LIST_NL="$(echo "$LIST" | tr ' ' '\n')"
            PICK=""
            for a in win64_msvc2022_64 win64_msvc2019_64 win64_mingw; do
              if echo "$LIST_NL" | grep -Fxq "$a"; then PICK="$a"; break; fi
            done
            if [ -z "$PICK" ]; then
              PICK="$(echo "$LIST_NL" | head -n1)"
            fi
            if [ -z "$PICK" ]; then
              echo "No Windows arch found for Qt ${QT_VERSION}" >&2
              exit 1
            fi
            echo "QT_ARCH=$PICK" >> "$GITHUB_ENV"
            echo "arch=$PICK" >> "$GITHUB_OUTPUT"
          else
            echo "QT_ARCH=${{ matrix.qt_arch }}" >> "$GITHUB_ENV"
            echo "arch=${{ matrix.qt_arch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}
          key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-${{ steps.resolve.outputs.arch }}-v1

      - name: Detect qtsvg module
        run: |
          set -e
          ARCH="${QT_ARCH:-${{ matrix.qt_arch }}}"
          MODS=$(python -m aqt list-qt "${{ matrix.host }}" desktop --modules "${QT_VERSION}" "$ARCH" || true)
          if echo "$MODS" | tr ' ' '\n' | grep -Fxq 'qtsvg'; then
            echo "AQT_MODULES=-m qtsvg" >> "$GITHUB_ENV"
          else
            echo "AQT_MODULES=" >> "$GITHUB_ENV"
          fi

      - name: Install Qt via aqt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          set -e
          ARCH="${QT_ARCH:-${{ matrix.qt_arch }}}"
          mkdir -p "$QT_ROOT"
          python -m aqt install-qt \
            "${{ matrix.host }}" desktop "${QT_VERSION}" \
            -O "$QT_ROOT" \
            "$ARCH" \
            ${AQT_MODULES}

      - name: Locate Qt (from Qt6Config.cmake)
        run: |
          set -e
          QT_CONFIG="$(find "$QT_ROOT" -type f -name Qt6Config.cmake -print -quit)"
          if [ -z "$QT_CONFIG" ]; then
            echo "Qt6Config.cmake not found under $QT_ROOT" >&2
            exit 1
          fi
          Qt6_DIR="$(dirname "$QT_CONFIG")"
          QT_PREFIX="$(dirname "$(dirname "$(dirname "$Qt6_DIR")")")"  # .../lib/cmake/Qt6 -> up 3 -> <arch>
          echo "Qt6_DIR=$Qt6_DIR"            >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "== Qt6 found at =="
          echo "$QT_PREFIX"
          ls -al "$Qt6_DIR/Qt6Config.cmake"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"

      - name: Build
        run: cmake --build build --config "${BUILD_TYPE}" -j

      - name: Test (optional)
        if: hashFiles('build/CTestTestfile.cmake') != ''
        run: ctest --test-dir build --output-on-failure -C "${BUILD_TYPE}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: build
          if-no-files-found: warn
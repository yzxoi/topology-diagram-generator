name: CMake Qt6 CI (Linux/macOS/Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.6.3"
  BUILD_TYPE: Release
  QT_ROOT: ${{ github.workspace }}/.qt

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
            qt_arch: gcc_64
          - os: macos-latest
            host: mac
            qt_arch: clang_64
          - os: windows-latest
            host: windows
            qt_arch: win64_msvc2022_64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}
          key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}-qtsvg-v2

      - name: Install aqt & tools
        run: |
          python -m pip install --upgrade pip
          pip install "aqtinstall==3.*" ninja cmake

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev libx11-xcb-dev libxext-dev libxrender-dev \
            libxcb1-dev libxcb-util-dev libxcb-image0-dev libxcb-render0-dev \
            libxcb-randr0-dev libxcb-keysyms1-dev libxcb-icccm4-dev \
            libxkbcommon-x11-0 libgl1-mesa-dev
      - name: Detect available Qt modules (qtsvg)
        run: |
          set -e
          # 列出该 host/arch 下该版本的可选模块；失败也不致命
          MODS=$(python -m aqt list-qt "${{ matrix.host }}" desktop --modules "${QT_VERSION}" "${{ matrix.qt_arch }}" || true)
          echo "Available modules: $MODS"
          if echo "$MODS" | grep -qw qtsvg; then
            echo "AQT_MODULES=-m qtsvg" >> "$GITHUB_ENV"
            echo "Will install with: -m qtsvg"
          else
            echo "qtsvg not listed for Qt ${QT_VERSION} (${ { matrix.host } }/${ { matrix.qt_arch } }); installing base Qt only."
            echo "AQT_MODULES=" >> "$GITHUB_ENV"
          fi

      - name: Install Qt via aqt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$QT_ROOT"
          python -m aqt install-qt \
            "${{ matrix.host }}" desktop "${QT_VERSION}" \
            -O "$QT_ROOT" \
            ${{ matrix.qt_arch }} \
            ${AQT_MODULES}

      - name: Locate Qt
        run: |
          set -e
          QT_CONFIG=$(find "$QT_ROOT" -type f -name Qt6Config.cmake -print -quit)
          if [ -z "$QT_CONFIG" ]; then
            echo "Qt6Config.cmake not found under $QT_ROOT" >&2
            exit 1
          fi
          # .../<arch>/lib/cmake/Qt6/Qt6Config.cmake -> .../<arch>
          QT_DIR=$(dirname "$(dirname "$(dirname "$QT_CONFIG")")")
          echo "QT_DIR=$QT_DIR" | tee -a "$GITHUB_ENV"
          echo "Qt6_DIR=$QT_DIR/lib/cmake/Qt6" | tee -a "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$QT_DIR" | tee -a "$GITHUB_ENV"
          echo "Found Qt at: $QT_DIR"
          ls -al "$QT_DIR/lib/cmake/Qt6/Qt6Config.cmake"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"

      - name: Build
        run: cmake --build build --config "${BUILD_TYPE}" -j

      - name: Test
        if: hashFiles('build/CTestTestfile.cmake') != ''
        run: ctest --test-dir build --output-on-failure -C "${BUILD_TYPE}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: build
          if-no-files-found: warn